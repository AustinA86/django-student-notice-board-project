<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>
    <!-- MODULE 2: Bootstrap for Styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- MODULE 5: jQuery for AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'notice-list' %}">Student Notice Board</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-white me-2">Hi {{ user.username }}</span>
                    <a href="{% url 'notice-create' %}" class="btn btn-light btn-sm">Add Notice</a>
                    <form action="{% url 'logout' %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-light btn-sm">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- MODULE 2: Template Inheritance block -->
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center mt-5 py-3 border-top">
        <p>&copy; 2024 Student Portal | <a href="{% url 'notice-feed' %}">RSS Feed</a></p>
    </footer>
</body>
</html>
