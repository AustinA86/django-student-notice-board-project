{% extends 'base.html' %}

{% block content %}
    <div class="col-md-6 mx-auto mt-5">
        <h2>Delete Notice</h2>
        <div class="card p-4 shadow-sm border-danger">
            <p>Are you sure you want to delete the notice "<strong>{{ object.title }}</strong>"?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'notice-detail' object.pk %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
